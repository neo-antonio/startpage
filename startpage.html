<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start</title>
<style>
:root{--accent:#2f6bff;--onacc:#fff;--text:#0f172a;--dim:#64748b;--line:#e6e8ec;--hover:#f1f3f6;--pop:#fff;--panel:rgba(255,255,255,.86);--ease:cubic-bezier(.2,.8,.2,1);--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.08);font:14px/1.45 "SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--text);letter-spacing:-.005em}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:#f7f8fa;animation:fade .5s ease}
#bg{position:fixed;inset:0;z-index:-1;transition:background .4s}
button,input,select{font:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
#app{display:flex;height:100vh}
aside{flex:none;width:296px;margin:12px 0 12px 12px;border-radius:20px;background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:width .34s var(--ease)}
body.rail aside{width:68px}
.sh{display:flex;align-items:center;gap:2px;padding:14px 10px 6px 18px}
.sh span{flex:1;font-weight:650;font-size:15px;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--dim);display:grid;place-items:center;font-size:20px;flex:none;transition:background .18s,color .18s}
.ib:hover{background:var(--hover);color:var(--text)}
.ib svg{transition:transform .34s var(--ease)}
body.rail #tog svg{transform:rotate(180deg)}
#q{margin:6px 14px 8px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--hover);color:var(--text);transition:border-color .2s,background .2s}
#q:focus{outline:0;border-color:var(--accent);background:var(--pop)}
#tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.chip{border:1px solid var(--line);background:none;color:var(--dim);border-radius:14px;padding:1px 10px;font-size:12px;transition:all .18s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
#list{overflow:auto;padding:2px 8px 10px;flex:1;scrollbar-width:none;-ms-overflow-style:none}
#list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:10px;color:var(--text);text-decoration:none;transition:background .15s}
.row:hover{background:var(--hover)}
.row .tile{width:28px;height:28px;font-size:13px;border-radius:8px;margin:0;flex:none;box-shadow:none;transition:width .3s var(--ease),height .3s var(--ease)}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx{flex:1;min-width:0;display:flex;flex-direction:column}.tx .nm{flex:none}.ds{color:var(--dim);font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--hover);color:var(--dim)}
.grp summary{cursor:pointer;display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:10px;font-weight:600;list-style:none;user-select:none;transition:background .15s}.grp summary::-webkit-details-marker{display:none}.grp summary:hover{background:var(--hover)}.grp summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin:0 4px 3px 2px;transition:transform .3s var(--ease)}.grp.closed summary::after{transform:rotate(-45deg);margin-bottom:0}.cnt{color:var(--dim);font-weight:500;font-size:12px}.gc{overflow:hidden}.row.drag,.grp.drag{opacity:.4}
.grp .row{margin-left:14px}
hr{border:0;border-top:1px solid var(--line);margin:8px 10px}
body.rail #q,body.rail #tags,body.rail .sh span,body.rail .tx,body.rail .nm,body.rail .tag,body.rail .gl{display:none}
body.rail .sh{flex-direction:column;padding:14px 0 6px;gap:4px;align-items:center}
body.rail .row{justify-content:center;padding:5px 0}
body.rail .row .tile{width:42px;height:42px;border-radius:13px;font-size:17px}
body.rail #list{padding:2px 0 10px}
.sfoot{padding:8px;border-top:1px solid var(--line);display:grid;gap:2px}
.sfoot button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 9px;border:0;background:none;color:var(--dim);border-radius:10px;white-space:nowrap;transition:background .18s,color .18s}
.sfoot button:hover{background:var(--hover);color:var(--text)}
body.rail .sfoot button{justify-content:center;padding:0}
.hint{color:var(--dim);grid-column:1/-1;text-align:center;margin:8px;font-size:13px}
main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:12vh 24px 40px;overflow:auto}
#clock{text-align:center;margin-bottom:32px}
#ck{display:block;font-size:92px;font-weight:300;letter-spacing:-.04em;line-height:1}
#cd{display:block;margin-top:14px;color:var(--dim);font-size:15px}
#sf{width:min(660px,100%);height:56px;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 8px 0 22px;background:var(--pop);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--dim);transition:box-shadow .25s,border-color .25s}
#sf:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent),var(--shadow)}
#sf input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:17px}
#sf button{width:42px;height:42px;border:0;border-radius:50%;background:var(--accent);color:var(--onacc);display:grid;place-items:center;transition:transform .2s var(--ease)}
#sf button:hover{transform:scale(1.07)}
#desk{width:min(920px,100%);margin-top:44px;display:grid;grid-template-columns:repeat(auto-fill,96px);gap:10px 12px;justify-content:center}
.ico{display:flex;flex-direction:column;align-items:center;width:96px;padding:10px 4px 8px;border-radius:14px;border:0;background:none;color:var(--text);font-size:12.5px;font-weight:500;line-height:1.25;text-align:center;text-decoration:none;transition:background .18s,opacity .2s}
.ico:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.ico:hover .tile{transform:translateY(-3px)}
.ico.drag{opacity:.35}
.ico span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word;padding:1px 6px;border-radius:6px}
body.img #desk .ico span{background:rgba(0,0,0,.4);color:#fff}
.tile{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:24px;font-weight:600;color:#fff;overflow:hidden;margin:0 auto 7px;box-shadow:0 2px 8px rgba(16,24,40,.14);transition:transform .25s var(--ease),box-shadow .25s}
.ico:hover .tile{box-shadow:0 8px 18px rgba(16,24,40,.2)}
.tile.has{background:#fff;box-shadow:0 0 0 1px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.1)}
.tile.fav img{width:64%;height:64%;object-fit:contain;border-radius:24%}
.tile.cus img{width:100%;height:100%;object-fit:cover}
.tile.fold{background:#fff;color:#111;box-shadow:0 0 0 1px rgba(16,24,40,.1),0 2px 8px rgba(16,24,40,.1)}.tile.fold svg{width:28px;height:28px;stroke-width:1.6}
.wh .la{padding:4px 12px;font-size:13px;font-weight:600;background:var(--accent);color:var(--onacc);border-color:var(--accent);margin-right:4px}.wh .la:hover{background:var(--accent);filter:brightness(1.08)}
.wh .hr{display:flex;align-items:center}
.qpick{max-height:230px;overflow:auto;margin:0 -4px 6px;padding:0 4px}.qpick label{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}.qpick .nm{flex:1}
dialog,dialog *,.ulist{scrollbar-width:none;-ms-overflow-style:none}
dialog::-webkit-scrollbar,dialog *::-webkit-scrollbar,.ulist::-webkit-scrollbar{display:none}
.tile.sm{width:26px;height:26px;border-radius:8px;margin:0;box-shadow:none;flex:none}.tile.sm svg{width:15px;height:15px}
#wins{position:fixed;inset:0;z-index:20;pointer-events:none}
.win{pointer-events:auto;position:fixed;width:min(440px,92vw);max-height:62vh;display:flex;flex-direction:column;background:var(--pop);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(16,24,40,.22);overflow:hidden}
.win.in{animation:pop .28s var(--ease)}
.wh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;cursor:grab;touch-action:none;user-select:none;font-weight:650;border-bottom:1px solid var(--line)}
.x{width:30px;height:30px;border:0;background:none;color:var(--dim);border-radius:9px;transition:all .18s}
.x:hover{background:var(--hover);color:var(--text)}
.wb{padding:12px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,96px);justify-content:center}
#ctx{position:fixed;z-index:60;background:var(--pop);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(16,24,40,.2);min-width:210px;animation:pop .16s var(--ease);transform-origin:top left}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:8px 12px;border-radius:9px}
#ctx button:hover{background:var(--hover)}
#ctx .dg{color:#e5484d}
dialog{border:1px solid var(--line);background:var(--pop);color:var(--text);border-radius:20px;padding:24px;width:min(470px,92vw);box-shadow:0 30px 80px rgba(16,24,40,.28)}
dialog[open]{animation:pop .26s var(--ease);max-height:88vh;overflow:auto}
dialog[open]::backdrop{animation:fade .25s ease}
dialog::backdrop{background:rgba(15,23,42,.35);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
dialog h3{margin:18px 0 8px;font-size:12.5px;color:var(--dim);font-weight:600}
.fld{display:grid;gap:5px;margin:12px 0}
.fld span{color:var(--dim);font-size:12.5px}
dialog input:not([type=checkbox]):not([type=color]),dialog select{background:var(--hover);border:1px solid transparent;color:var(--text);border-radius:10px;padding:9px 12px;transition:border-color .2s,background .2s}
dialog input:focus,dialog select:focus{outline:0;border-color:var(--accent);background:var(--pop)}
dialog option{background:var(--pop);color:var(--text)}
dialog input[type=color]{width:56px;height:36px;padding:0;border:1px solid var(--line);background:none;border-radius:10px}
.bar{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn,.bar button{border:1px solid var(--line);background:var(--pop);color:var(--text);border-radius:10px;padding:8px 18px;transition:background .18s}
.btn:hover,.bar button:hover{background:var(--hover)}
.bar .pri{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:600}
.bar .pri:hover{background:var(--accent);filter:brightness(1.08)}
.pvr{display:flex;align-items:center;gap:14px}
.pvr .tile{margin:0;flex:none}
.sws,.rw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:68px;height:42px;border-radius:12px;border:1px solid var(--line);color:inherit;font-size:11px;font-weight:600;transition:transform .2s var(--ease)}
.sw:hover{transform:translateY(-2px)}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sec{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.sec h3{margin:0 0 12px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.th{border:0;background:none;padding:0;text-align:left;color:var(--text);font-size:12.5px;font-weight:600}
.th i{display:block;height:56px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;position:relative;transition:transform .22s var(--ease),box-shadow .22s}
.th i::after{content:'';position:absolute;left:10px;right:34px;bottom:10px;height:8px;border-radius:5px;background:var(--pc)}
.th:hover i{transform:translateY(-2px)}
.th.on i{box-shadow:0 0 0 2px var(--pop),0 0 0 4px var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid rgba(16,24,40,.14);padding:0;position:relative;transition:transform .2s var(--ease),box-shadow .2s}
.dot:hover{transform:scale(1.12)}
.dot.on{box-shadow:0 0 0 2px var(--pop),0 0 0 4px var(--accent)}
.dot.cu{background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#6366f1,#f43f5e)}
.dot input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.lab{font-size:12.5px;color:var(--dim);margin:12px 0 8px}
.sec .lab:first-of-type{margin-top:0}
.up{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--dim);border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--pop);color:var(--text);transition:all .2s}
.up:hover{border-color:var(--accent);color:var(--accent)}
.up input{display:none}
.bgp{width:76px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--hover) center/cover}
.trow{display:flex;align-items:center;gap:10px;padding:5px 0;transition:opacity .2s}
.trow input{flex:1}
.trow .n{color:var(--dim);font-size:12px;min-width:74px;text-align:right}
.trow.del{opacity:.35}.trow.del input{text-decoration:line-through}
.ig{display:grid;grid-template-columns:repeat(auto-fill,46px);gap:8px}
.ib2{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--pop);color:var(--text);display:grid;place-items:center;padding:0;transition:all .18s}
.ib2 svg{width:22px;height:22px}
.ib2:hover{color:var(--text);background:var(--hover)}
.ib2.on{background:var(--hover);border-color:var(--text)}
.pvr .fld{flex:1;margin:0}
.dbg #clock,.dbg #desk .ico{color:#fff}.dbg #cd{color:rgba(255,255,255,.75)}
.note{font-size:12.5px;color:var(--dim);margin:16px 0 0}
.btn.danger{color:#e5484d}.btn.danger:hover{background:color-mix(in srgb,#e5484d 10%,transparent)}
body.ctr #desk{display:flex;flex-wrap:wrap;justify-content:center}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;position:relative}
.tgl b{display:block;font-weight:600}.tgl span{color:var(--dim);font-size:12.5px}
.tgl input{position:absolute;opacity:0}
.knob{flex:none;width:42px;height:24px;border-radius:12px;background:color-mix(in srgb,var(--dim) 40%,transparent);position:relative;transition:background .25s}
.knob::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.tgl input:checked~.knob{background:var(--accent)}.tgl input:checked~.knob::after{transform:translateX(18px)}
.tgl input:focus-visible~.knob{outline:2px solid var(--accent);outline-offset:2px}
.bfx{margin-top:10px;display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px}
.bfx .lab{margin:0}
.bres{max-height:196px;overflow:auto;padding:2px}
.bres .ib2 img{width:26px;height:26px;object-fit:contain}
.seg{display:inline-flex;justify-self:start;background:var(--hover);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--dim);padding:5px 14px;border-radius:8px;transition:all .2s}
.seg .on{background:var(--pop);color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.14)}
#sort.act{color:var(--accent)}
#ctx button.ck{display:flex;align-items:center}
#ctx button.ck::before{content:'';width:20px;flex:none;font-size:13px;color:var(--accent)}
#ctx button.ck.on::before{content:'✓'}
.btn:disabled{opacity:.45;cursor:default}.btn:disabled:hover{background:var(--pop)}
.ulist{max-height:210px;overflow:auto;margin:0 -4px 10px;padding:0 4px}
.ur{display:flex;align-items:center;gap:10px;padding:4px 0}
.ur .tile{width:26px;height:26px;border-radius:8px;margin:0;font-size:12px;box-shadow:none;flex:none}
.ur .c{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
body.rnd .tile,body.rnd.rail .row .tile{border-radius:30%}
body:not(.rnd) .tile,body:not(.rnd).rail .row .tile{border-radius:8%}
.szc{background:var(--hover);border-radius:14px;padding:11px 14px 12px;display:grid;gap:6px;margin:12px 0}.szc[hidden]{display:none}
.szh{display:flex;align-items:center;gap:8px}.szh b{flex:1;font-weight:600;font-size:13px}
.szh .v{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--pop);border:1px solid var(--line);border-radius:8px;padding:1px 9px;min-width:46px;text-align:center}
.szh .rs{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:2px 6px;border-radius:6px;transition:opacity .2s,background .2s}.szh .rs:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 12%,transparent)}.szh .rs:disabled{opacity:.35;cursor:default}
.szr{display:flex;align-items:center;gap:10px;color:var(--dim)}.szr span{display:grid;place-items:center;flex:none}
dialog input.sl[type=range]:not([hidden]),dialog input.sl[type=range]:focus{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:22px;padding:0;margin:0;border:0;border-radius:0;background:transparent;cursor:pointer}
.sl::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,50%),color-mix(in srgb,var(--text) 16%,transparent) var(--p,50%))}
.sl::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,50%),color-mix(in srgb,var(--text) 16%,transparent) var(--p,50%))}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 4px rgba(16,24,40,.28);transition:transform .15s var(--ease),box-shadow .15s}
.sl::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 4px rgba(16,24,40,.28);transition:transform .15s}
.sl:hover::-webkit-slider-thumb,.sl:active::-webkit-slider-thumb{transform:scale(1.12)}.sl:hover::-moz-range-thumb,.sl:active::-moz-range-thumb{transform:scale(1.12)}
.sl:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}.sl:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
body.rnd .tile.cus img{width:78%;height:78%;border-radius:24%}
.sec .tgl+.tgl{margin-top:14px}
@media(prefers-reduced-motion:reduce){*,::backdrop{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <aside>
    <div class="sh">
      <span>Shortcuts</span>
      <button class="ib" id="sort" title="Sort shortcuts" aria-label="Sort shortcuts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
      <button class="ib" id="add" title="New shortcut" aria-label="New shortcut">+</button>
      <button class="ib" id="tog" title="Collapse or expand sidebar" aria-label="Collapse or expand sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
    </div>
    <input id="q" type="search" placeholder="Search" aria-label="Search">
    <div id="tags"></div>
    <div id="list"></div>
    <div class="sfoot"><button id="look" title="Appearance"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(45 12 12)"><rect x="10.5" y="1.5" width="3" height="8.5" rx="1.5"/><path d="M9.5 10h5v3.5h-5z"/><path d="M9.5 13.5h5v2.5c0 2.2-1.3 4.2-2.5 5.5-1.2-1.3-2.5-3.3-2.5-5.5z"/></g></svg><span class="gl">Appearance</span></button><button id="gear" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg><span class="gl">Settings</span></button></div>
  </aside>
  <main>
    <div id="clock"><span id="ck"></span><span id="cd"></span></div>
    <form id="sf" action="https://www.google.com/search" role="search">
